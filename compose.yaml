services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: evalrag
      POSTGRES_USER: evalrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalrag -d evalrag"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      EVALRAG_DATABASE_URL: postgresql+psycopg://evalrag:${POSTGRES_PASSWORD}@db:5432/evalrag
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    environment: &backend_environment
      EVALRAG_DATABASE_URL: postgresql+psycopg://evalrag:${POSTGRES_PASSWORD}@db:5432/evalrag
      EVALRAG_OPENAI_API_KEY: ${EVALRAG_OPENAI_API_KEY:-}
      EVALRAG_GENERATION_MODEL: ${EVALRAG_GENERATION_MODEL:-gpt-4.1-mini}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    build: ./backend
    command: ["python", "-m", "evalrag.worker"]
    environment: *backend_environment
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  db_data:
